name: CI

# ── 触发规则：质量门禁在所有开发分支上尽早、频繁地运行 ──
# CI (持续集成) 的核心目的是快速反馈代码质量,因此应在每次 push 时自动触发。
# - main:       生产主分支,最严格检查
# - feat/**:    新功能开发分支,每次提交立刻验证
# - agentic-system/**: 按域组织的功能分支,与 feat/** 同理
# - PR to main:  向 main 发起 PR 时再次验证,作为合并的硬性门槛
on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'agentic-system/**'
  pull_request:
    branches: [main]

# ── 非敏感 CI 环境变量 ──
# JWT_SECRET / INTERNAL_SERVICE_TOKEN / TOOL_SECRET_ENCRYPTION_KEY 为 CI 占位值,
# 仅用于让 Go 配置启动检查不 panic、让 security-check.sh 的弱值校验通过。
# 生产部署必须通过 .env 覆盖。
env:
  DB_USER: platform
  DB_PASSWORD: platform_dev
  DB_NAME: enterprise_agent_platform
  DB_HOST: localhost
  DB_PORT: 5432
  REDIS_HOST: localhost
  REDIS_PORT: 6379
  JWT_SECRET: ci-jwt-secret-not-for-production-use-32-chars
  INTERNAL_SERVICE_TOKEN: ci-internal-service-token-not-for-production
  TOOL_SECRET_ENCRYPTION_KEY: ci-tool-secret-encryption-key-32-bytes
  LLM_PROVIDER: qwen
  LLM_MODEL: qwen-plus
  LLM_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
  LLM_API_KEY: dummy
  AGENT_SERVICE_URL: http://localhost:8000
  MINIO_ENDPOINT: localhost:9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  TEST_DATABASE_URL: postgresql://platform:platform_dev@localhost:5432/enterprise_agent_platform
  RUNTIME_DATABASE_URL: postgresql://platform:platform_dev@localhost:5432/enterprise_agent_platform

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest

    # PostgreSQL(pgvector) + Redis:
    # - pgvector/pgvector:pg16 自带 vector extension,满足 032_pgvector_migration.up.sql
    # - 集成测试 (*_integration_test.go / test_runtime_store_pg.py) 通过
    #   t.SkipUnless DSN 控制,service 起来后自动 unskip
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform_dev
          POSTGRES_DB: enterprise_agent_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-platform/go.mod
          cache-dependency-path: go-platform/go.sum

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-service/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends postgresql-client
          psql --version

      # 按文件名顺序应用所有 *.up.sql 迁移。
      # psql -v ON_ERROR_STOP=1 保证任何一条迁移失败立即终止。
      - name: Apply database migrations
        run: |
          set -euo pipefail
          export PGPASSWORD=platform_dev
          for f in $(ls go-platform/migrations/*.up.sql | sort); do
            echo "==> applying $f"
            psql -h localhost -U platform -d enterprise_agent_platform \
              -v ON_ERROR_STOP=1 -f "$f"
          done

      # Go 全量测试:unit + integration。
      # -race 检测并发问题,-timeout 防止卡死,-cover 收集覆盖率。
      - name: Go tests
        working-directory: go-platform
        run: |
          go test \
            -race \
            -timeout 10m \
            -coverprofile=coverage.out \
            -covermode=atomic \
            ./...
      - name: Go coverage summary
        working-directory: go-platform
        run: |
          go tool cover -func=coverage.out | tail -n 1 || true

      # Python: 安装依赖 + 编译检查 + 全量测试。
      # unittest discover 跑 tests/ 下所有用例,集成测试在 DSN 缺失时 skip。
      - name: Python dependencies
        working-directory: agent-service
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Python compile check
        working-directory: agent-service
        run: python -m compileall app

      - name: Python tests
        working-directory: agent-service
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

      # 前端:Vitest + RTL smoke + 覆盖率 + 构建。
      # AGENTS.md 约定:核心页面 vitest+RTL 覆盖率 ≥ 50%。
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

      - name: Upload Go coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: go-platform/coverage.out
          retention-days: 7

      # 安全检查:检测被 git 跟踪的 .env 文件、真实 secret、弱生产配置。
      - name: Security check
        run: bash scripts/security-check.sh
