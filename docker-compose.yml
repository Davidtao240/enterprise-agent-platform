services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-platform}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-platform_dev}
      POSTGRES_DB: ${DB_NAME:-enterprise_agent_platform}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-platform}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  go-backend:
    build:
      context: ./go-platform
      dockerfile: Dockerfile
    ports:
      - "${GO_SERVER_PORT:-8080}:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-platform}
      DB_PASSWORD: ${DB_PASSWORD:-platform_dev}
      DB_NAME: ${DB_NAME:-enterprise_agent_platform}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      FILE_STORAGE_DIR: /app/storage/files
      AGENT_SERVICE_URL: http://agent-service:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      GO_SERVER_MODE: ${GO_SERVER_MODE:-release}
      STRICT_DOMAIN_POLICY: ${STRICT_DOMAIN_POLICY:-false}
      WORKER_RUNTIME_V2: ${WORKER_RUNTIME_V2:-true}
      # M2-C/D: Tool Execution 可靠性与凭证加密(开发默认值,生产必须覆盖)
      TOOL_CALL_DEFAULT_TIMEOUT: ${TOOL_CALL_DEFAULT_TIMEOUT:-2m}
      TOOL_CALL_TIMEOUT_SCAN_EVERY: ${TOOL_CALL_TIMEOUT_SCAN_EVERY:-15s}
      TOOL_CALL_MAX_RETRY: ${TOOL_CALL_MAX_RETRY:-3}
      TOOL_CIRCUIT_FAILURE_THRESHOLD: ${TOOL_CIRCUIT_FAILURE_THRESHOLD:-5}
      TOOL_CIRCUIT_COOLDOWN: ${TOOL_CIRCUIT_COOLDOWN:-60s}
      TOOL_SECRET_ENCRYPTION_KEY: ${TOOL_SECRET_ENCRYPTION_KEY:?TOOL_SECRET_ENCRYPTION_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12

  agent-service:
    build:
      context: ./agent-service
      dockerfile: Dockerfile
    ports:
      - "${AGENT_SERVICE_PORT:-8000}:8000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-qwen}
      LLM_MODEL: ${LLM_MODEL:-qwen3.7-flash}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      FILE_SERVICE_URL: http://go-backend:8080
      DATABASE_URL: postgresql://${DB_USER:-platform}:${DB_PASSWORD:-platform_dev}@postgres:5432/${DB_NAME:-enterprise_agent_platform}
      # ADR-009: Agent Runtime(checkpoint + runtime_v2_*)迁 PostgreSQL,
      # 本地 SQLite checkpoint volume 随之退役
      RUNTIME_DATABASE_URL: postgresql://${DB_USER:-platform}:${DB_PASSWORD:-platform_dev}@postgres:5432/${DB_NAME:-enterprise_agent_platform}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      RUNTIME_EVENT_URL: http://go-backend:8080/internal/v2/runtime-events
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()\""]
      interval: 5s
      timeout: 3s
      retries: 12

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      go-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
  redis_data:
  minio_data: