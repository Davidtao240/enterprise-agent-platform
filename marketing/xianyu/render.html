<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>企业AI智能体定制</title>
  <style>
    :root {
      --ink: #101828;
      --cyan: #2f6bff;
      --green: #14966a;
      --white: #ffffff;
      --muted: #667085;
      --line: #dce5f0;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 1440px;
      height: 1440px;
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: #f7f8fa;
    }
    .artboard {
      position: relative;
      width: 1440px;
      height: 1440px;
      overflow: hidden;
      background: #f7f8fa url("backgrounds/enterprise-light-bg.png") center/cover no-repeat;
    }
    .artboard::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 74% 16%, rgba(47, 107, 255, .07), transparent 30%),
        linear-gradient(180deg, rgba(255, 255, 255, .08), rgba(245, 247, 250, .22));
      pointer-events: none;
    }
    .top { position: absolute; z-index: 3; left: 84px; top: 72px; right: 84px; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 10px 18px;
      border: 1px solid #d7e0ec;
      border-radius: 999px;
      background: rgba(255, 255, 255, .88);
      color: #344054;
      font-size: 22px;
      font-weight: 650;
      letter-spacing: 1px;
      box-shadow: 0 8px 28px rgba(16, 24, 40, .07);
      backdrop-filter: blur(12px);
    }
    .pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 6px rgba(20, 150, 106, .1); }
    h1 { margin: 24px 0 10px; font-size: 78px; line-height: 1.06; letter-spacing: -2px; font-weight: 850; }
    .sub { color: #475467; font-size: 35px; font-weight: 650; letter-spacing: 1px; }
    .accent { color: var(--cyan); }
    .card {
      position: absolute;
      z-index: 2;
      overflow: hidden;
      border: 1px solid #dfe6ef;
      border-radius: 28px;
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 28px 80px rgba(16, 24, 40, .15), 0 2px 8px rgba(16, 24, 40, .06);
      backdrop-filter: blur(18px);
    }
    .windowbar {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      color: #475467;
      font-size: 19px;
      background: #f8fafc;
      border-bottom: 1px solid #e4eaf1;
    }
    .dots { display: flex; gap: 9px; }
    .dots span { width: 11px; height: 11px; border-radius: 50%; background: #c8d2df; }
    .dots span:nth-child(2) { background: #7fa7ff; }
    .dots span:nth-child(3) { background: #70c8a7; }
    .shot { position: relative; overflow: hidden; background: #fff; }
    .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
    .hero-card { left: 84px; top: 400px; width: 1272px; height: 850px; }
    .hero-card .shot { height: 794px; }
    .hero-card .shot img { object-position: top left; }
    .chips { position: absolute; z-index: 3; left: 84px; right: 84px; bottom: 68px; display: flex; gap: 18px; }
    .chip {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      height: 78px;
      border: 1px solid #dce4ee;
      border-radius: 20px;
      background: rgba(255, 255, 255, .9);
      color: #1d2939;
      font-size: 25px;
      font-weight: 700;
      box-shadow: 0 12px 34px rgba(16, 24, 40, .08);
      backdrop-filter: blur(14px);
    }
    .check { color: var(--green); font-size: 28px; }

    .tech-title h1, .deploy-title h1 { font-size: 68px; }
    .tech-grid { position: absolute; z-index: 2; left: 76px; right: 76px; top: 338px; bottom: 76px; }
    .panel { position: absolute; overflow: hidden; border-radius: 25px; border: 1px solid #dfe6ef; background: #fff; box-shadow: 0 24px 62px rgba(16,24,40,.14); }
    .panel-label { position: absolute; z-index: 3; left: 20px; top: 18px; display: inline-flex; align-items: center; gap: 10px; padding: 9px 15px; border-radius: 12px; background: rgba(255, 255, 255, .94); border: 1px solid #dce4ee; box-shadow: 0 8px 26px rgba(16,24,40,.1); font-size: 21px; font-weight: 750; color: #1d2939; }
    .approval-panel { left: 0; top: 0; width: 610px; height: 960px; }
    .approval-panel img { position: absolute; height: 100%; width: auto; left: -312px; top: 0; }
    .audit-panel { right: 0; top: 0; width: 650px; height: 455px; }
    .audit-panel img { position: absolute; width: 100%; height: auto; left: 0; top: 0; }
    .registry-panel { right: 0; bottom: 0; width: 650px; height: 455px; }
    .registry-panel img { position: absolute; width: 100%; height: auto; left: 0; top: 0; }
    .panel::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,.55); pointer-events: none; }

    .terminal {
      position: absolute;
      z-index: 2;
      left: 88px;
      top: 365px;
      width: 1264px;
      height: 875px;
      overflow: hidden;
      border-radius: 28px;
      background: rgba(255, 255, 255, .96);
      border: 1px solid #dce4ee;
      box-shadow: 0 30px 82px rgba(16,24,40,.15), 0 2px 8px rgba(16,24,40,.05);
    }
    .term-head { height: 76px; display:flex; align-items:center; justify-content:space-between; padding: 0 28px; border-bottom:1px solid #e4eaf1; background:#f8fafc; }
    .term-title { font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 22px; color:#344054; }
    .verified { display:flex; align-items:center; gap:10px; color:#14835f; font-weight:700; font-size:20px; }
    .command { height: 92px; display:flex; align-items:center; padding:0 34px; font-family:"SFMono-Regular", Menlo, monospace; color:#475467; font-size:25px; border-bottom:1px solid #e7ecf2; background:#fbfcfd; }
    .command b { color: var(--green); margin-right: 14px; }
    .service-head, .service-row { display:grid; grid-template-columns: 1.35fr 1.35fr .65fr; align-items:center; padding:0 34px; }
    .service-head { height:58px; color:#667085; font-family:"SFMono-Regular", Menlo, monospace; font-size:18px; border-bottom:1px solid #e7ecf2; background:#f9fafb; }
    .service-row { height:82px; border-bottom:1px solid #edf0f4; font-family:"SFMono-Regular", Menlo, monospace; }
    .service-name { display:flex; align-items:center; gap:15px; color:#1d2939; font-size:22px; font-weight:700; }
    .service-role { color:#667085; font-size:19px; }
    .state { justify-self:start; display:inline-flex; align-items:center; gap:9px; padding:8px 13px; border-radius:999px; background:#ecfdf3; border:1px solid #abefc6; color:#067647; font-size:18px; font-weight:750; }
    .state-dot { width:9px; height:9px; border-radius:50%; background:var(--green); box-shadow:0 0 13px var(--green); }
    .deploy-foot { position:absolute; z-index:3; left:88px; right:88px; bottom:68px; display:flex; justify-content:space-between; align-items:center; color:#475467; font-size:22px; }
    .deliverables { display:flex; gap:14px; }
    .deliverables span { padding:10px 15px; border:1px solid #dce4ee; border-radius:12px; background:rgba(255,255,255,.9); box-shadow:0 8px 24px rgba(16,24,40,.06); }
    .count { color:var(--green); font-size:26px; font-weight:800; }

    .multisync-title h1 { font-size: 68px; }
    .multisync-card {
      left: 84px;
      top: 365px;
      width: 1272px;
      height: 930px;
    }
    .multisync-card .shot { height: 874px; }
    .multisync-card .shot img {
      width: 100%;
      height: auto;
      object-fit: initial;
      object-position: initial;
    }
    .case-chips { bottom: 55px; }
    .case-chips .chip { height: 72px; font-size: 23px; }

    .delivery-stack {
      position: absolute;
      z-index: 2;
      left: 84px;
      right: 84px;
      top: 350px;
      bottom: 70px;
      display: grid;
      grid-template-rows: 390px 520px;
      gap: 28px;
    }
    .delivery-card {
      position: relative;
      overflow: hidden;
      border: 1px solid #dfe6ef;
      border-radius: 26px;
      background: rgba(255, 255, 255, .97);
      box-shadow: 0 24px 65px rgba(16, 24, 40, .13);
    }
    .delivery-card .shot { height: calc(100% - 56px); }
    .delivery-input .shot img {
      width: 100%;
      height: auto;
      object-fit: initial;
      object-position: initial;
    }
    .delivery-output .shot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center bottom;
    }
    .flow-tag {
      position: absolute;
      z-index: 5;
      left: 50%;
      top: 372px;
      transform: translate(-50%, -50%);
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 11px 20px;
      border-radius: 999px;
      border: 1px solid #cbdcff;
      background: #f4f7ff;
      color: #2459d6;
      font-size: 20px;
      font-weight: 800;
      box-shadow: 0 10px 30px rgba(47, 107, 255, .14);
    }

    .architecture-card {
      left: 64px;
      top: 360px;
      width: 1312px;
      height: 795px;
    }
    .architecture-card .shot { height: 739px; background: #fff; }
    .architecture-card .shot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }
    .architecture-chips { left: 64px; right: 64px; bottom: 74px; gap: 14px; }
    .architecture-chips .chip { height: 76px; font-size: 22px; }
  </style>
</head>
<body>
  <main id="root"></main>
  <script>
    const page = new URLSearchParams(location.search).get('page') || 'hero';
    const bg = `<div class="artboard">`;
    const renderHeader = (eyebrow, title, sub, extra='') => `
      <section class="top ${extra}">
        <div class="eyebrow"><span class="pulse"></span>${eyebrow}</div>
        <h1>${title}</h1>
        <div class="sub">${sub}</div>
      </section>`;
    const windowBar = title => `<div class="windowbar"><div class="dots"><span></span><span></span><span></span></div><div>${title}</div></div>`;

    const hero = `${bg}
      ${renderHeader('真实项目 · 企业级智能体工作台', '企业<span class="accent">AI智能体</span>定制', '源码交付｜私有化部署｜数据可控')}
      <section class="card hero-card">
        ${windowBar('真实工作流详情 · Agent执行 · 人工复核 · 审计归档')}
        <div class="shot"><img src="sources/enterprise-workflow-detail.png" /></div>
      </section>
      <section class="chips">
        <div class="chip"><span class="check">✓</span>多Agent协同</div>
        <div class="chip"><span class="check">✓</span>人工复核</div>
        <div class="chip"><span class="check">✓</span>全程审计</div>
        <div class="chip"><span class="check">✓</span>源码部署</div>
      </section>
    </div>`;

    const tech = `${bg}
      ${renderHeader('真实项目能力展示', '企业级能力，<span class="accent">不止聊天</span>', '人工复核｜审计追踪｜Agent能力注册', 'tech-title')}
      <section class="tech-grid">
        <div class="panel approval-panel">
          <div class="panel-label"><span class="check">✓</span>人工复核 · 风险提示</div>
          <img src="sources/enterprise-approval-pending.png" />
        </div>
        <div class="panel audit-panel">
          <div class="panel-label"><span class="check">✓</span>全链路审计追踪</div>
          <img src="sources/enterprise-audit-log.png" />
        </div>
        <div class="panel registry-panel">
          <div class="panel-label"><span class="check">✓</span>Agent注册与复用</div>
          <img src="sources/enterprise-agent-registry.png" />
        </div>
      </section>
    </div>`;

    const services = [
      ['frontend', 'React企业工作台'],
      ['go-backend', '工作流 / 审批 / 审计'],
      ['agent-service', 'FastAPI + LangGraph'],
      ['postgres', '业务数据持久化'],
      ['redis', '缓存与任务队列'],
      ['minio', '私有对象存储'],
      ['qdrant', '向量检索服务'],
    ];
    const serviceRows = services.map(([name, role]) => `
      <div class="service-row">
        <div class="service-name"><span class="state-dot"></span>${name}</div>
        <div class="service-role">${role}</div>
        <div class="state"><span class="state-dot"></span>healthy</div>
      </div>`).join('');
    const deploy = `${bg}
      ${renderHeader('真实Docker运行状态', '私有化部署 · <span class="accent">7项服务健康运行</span>', 'Docker Compose一键部署｜前后端与数据服务完整交付', 'deploy-title')}
      <section class="terminal">
        <div class="term-head">
          <div class="dots"><span></span><span></span><span></span></div>
          <div class="term-title">enterprise-agent-platform / docker compose</div>
          <div class="verified"><span class="state-dot"></span>VERIFIED</div>
        </div>
        <div class="command"><b>$</b> docker compose ps</div>
        <div class="service-head"><div>SERVICE</div><div>ROLE</div><div>STATUS</div></div>
        ${serviceRows}
      </section>
      <section class="deploy-foot">
        <div class="deliverables"><span>前后端源码</span><span>部署脚本</span><span>运维文档</span></div>
        <div><span class="count">7 / 7</span> healthy</div>
      </section>
    </div>`;

    const multisyncCase = `${bg}
      ${renderHeader('真实项目 · MultiSync 多智能体协作', '多智能体<span class="accent">需求交付系统</span>', '从一句需求到结构化交付', 'multisync-title')}
      <section class="card multisync-card">
        ${windowBar('真实任务详情 · 全流程进度 100% · 交付产物可追溯')}
        <div class="shot"><img src="sources/multisync-task-detail.png" /></div>
      </section>
      <section class="chips case-chips">
        <div class="chip"><span class="check">✓</span>需求澄清</div>
        <div class="chip"><span class="check">✓</span>方案设计</div>
        <div class="chip"><span class="check">✓</span>智能评审</div>
        <div class="chip"><span class="check">✓</span>人工审批</div>
        <div class="chip"><span class="check">✓</span>交付打包</div>
      </section>
    </div>`;

    const multisyncDeliverables = `${bg}
      ${renderHeader('真实项目 · 输入与交付结果', '一次输入，生成<span class="accent">完整交付包</span>', 'PRD｜技术方案｜代码骨架｜评审报告', 'multisync-title')}
      <section class="delivery-stack">
        <div class="delivery-card delivery-input">
          ${windowBar('01 · 描述业务需求，启动多智能体协作')}
          <div class="shot"><img src="sources/multisync-create-task.png" /></div>
        </div>
        <div class="flow-tag"><span class="check">✓</span>AI 多智能体协作 · 人工节点可介入</div>
        <div class="delivery-card delivery-output">
          ${windowBar('02 · 结构化成果与源文件统一导出')}
          <div class="shot"><img src="sources/multisync-deliverables.png" /></div>
        </div>
      </section>
    </div>`;

    const multisyncArchitecture = `${bg}
      ${renderHeader('真实项目 · 技术架构', '五层架构 · <span class="accent">多智能体协作闭环</span>', 'Vue 3｜FastAPI｜LangGraph｜SQLite / Chroma｜模型服务', 'multisync-title')}
      <section class="card architecture-card">
        ${windowBar('MultiSync · AI多智能体需求交付系统技术架构')}
        <div class="shot"><img src="sources/multisync-architecture.png" /></div>
      </section>
      <section class="chips architecture-chips">
        <div class="chip"><span class="check">✓</span>异步任务队列</div>
        <div class="chip"><span class="check">✓</span>断点续跑</div>
        <div class="chip"><span class="check">✓</span>长期记忆</div>
        <div class="chip"><span class="check">✓</span>Human-in-the-Loop</div>
      </section>
    </div>`;

    const pages = {
      hero,
      tech,
      deploy,
      'multisync-case': multisyncCase,
      'multisync-deliverables': multisyncDeliverables,
      'multisync-architecture': multisyncArchitecture,
    };
    document.getElementById('root').innerHTML = pages[page] || hero;
  </script>
</body>
</html>
